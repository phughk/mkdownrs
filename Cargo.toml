[package]
name = "mkdownrs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
mime_guess = "2.0.5"
minijinja = { version = "2.24.0", features = ["serde"] }
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
